services:
  jellystat-db:
    image: postgres:15.14@sha256:822f8795764a670160640888508b2a68ea5c4b045012c2de17e1d0447bdbdc99
    command:
    - postgres
    - -c
    - max_connections=200
    environment:
      POSTGRES_USER: jellystat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jellystat
    volumes:
    - jellystat-swarm_jellystat-db-data:/var/lib/postgresql/data
    deploy:
      placement:
        constraints:
        - node.labels.deployment.target.jellystat == true
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER
      interval: 10s
      timeout: 5s
      retries: 5
  jellystat:
    image: cyfershepard/jellystat:latest
    environment:
      POSTGRES_USER: jellystat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_IP: jellystat-db
      POSTGRES_PORT: '5432'
      JWT_SECRET: kuvnlQN5eZdUFFDVhTFUTuR1UZDTPuOhfmEI4XdIQG9koPSTLkPFrermR1p7qLjdzAC2NQrF
      TZ: America/Chicago
      JS_USER: admin
      JS_PASSWORD: uVHdI7R1Y8XsrPJ84sn2e7Jse9zjW7
      POSTGRES_DB: jfstat
    volumes:
    - jellystat-swarm_jellystat-backup:/app/backend/backup-data
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
      mode: host
    depends_on:
    - jellystat-db
    deploy:
      replicas: 1
      placement:
        constraints:
        - node.labels.deployment.target.jellystat == true
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:3000/ || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
networks:
  jellystat-net:
    driver: overlay
    attachable: true
volumes:
  jellystat-swarm_jellystat-db-data:
    name: jellystat-swarm_jellystat-db-data
  jellystat-swarm_jellystat-backup:
    name: jellystat-swarm_jellystat-backup
