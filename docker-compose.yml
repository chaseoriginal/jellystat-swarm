services:
  jellystat-db:
    image: postgres:15.14
    command:
    - postgres
    - -c
    - max_connections=200
    environment:
      POSTGRES_USER: jellystat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - jellystat-swarm_jellystat-backup:/app/backend/backup-data
    networks:
    - jellystat-net
    deploy:
      placement:
        constraints:
        - node.labels.deployment.target.jellystat == true
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER
      interval: 10s
      timeout: 5s
      retries: 5
  jellystat:
    image: cyfershepard/jellystat:latest
    environment:
      POSTGRES_USER: jellystat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_IP: jellystat-db
      POSTGRES_PORT: '5432'
      JWT_SECRET: ${JWT_SECRET}
      TZ: America/Chicago
      JS_USER: admin
      JS_PASSWORD: ${JS_PASSWORD}
    volumes:
    - jellystat-swarm_jellystat-backup:/app/backend/backup-data
    networks:
    - jellystat-net
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
      mode: host
    depends_on:
    - jellystat-db
    deploy:
      replicas: 1
      placement:
        constraints:
        - node.labels.deployment.target.jellystat == true
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:3000/ || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
networks:
  jellystat-net:
    driver: overlay
    attachable: true
volumes:
  jellystat-swarm_jellystat-backup:
    name: jellystat-swarm_jellystat-backup
